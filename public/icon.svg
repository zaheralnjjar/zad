<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="488" height="488" x="12" y="12" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Eight-pointed Islamic Star (Khatim Sulayman) -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#shadow)">
    <!-- Square 1 -->
    <rect x="-100" y="-100" width="200" height="200" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Square 2 rotated 45 degrees -->
    <rect x="-100" y="-100" width="200" height="200" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="12" transform="rotate(45)"/>
  </g>

  <!-- Quran Book / Minbar Motif in center -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Open Book -->
    <path d="M-60 -25 C-30 -35 -10 -25 0 -15 C10 -25 30 -35 60 -25 L60 40 C30 30 10 40 0 50 C-10 40 -30 30 -60 40 Z" fill="url(#goldGrad)"/>
    <path d="M-55 -20 C-30 -28 -10 -20 0 -10 C10 -20 30 -28 55 -20 L55 35 C30 27 10 35 0 45 C-10 35 -30 27 -55 35 Z" fill="#064e3b" opacity="0.4"/>
    <line x1="0" y1="-12" x2="0" y2="48" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Minbar Arch Outline -->
    <path d="M-30 -85 C-30 -115 30 -115 30 -85 L30 -50 L-30 -50 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="0" cy="-88" r="6" fill="#064e3b"/>
  </g>

  <!-- Islamic Calligraphic Flourish Dots -->
  <circle cx="256" cy="95" r="8" fill="url(#goldGrad)"/>
  <circle cx="256" cy="417" r="8" fill="url(#goldGrad)"/>
</svg>
